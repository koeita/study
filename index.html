<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>すうじ つみき（さんすう あそび）</title>
  <!-- Google Fonts: M PLUS Rounded 1c (700 / 800) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="app-wrapper">
    <!-- 1段目：上部「もんだい黒板」エリア -->
    <header class="blackboard-container">
      <div class="blackboard-top-row">
        <button id="btn-back-title" class="bb-ctrl-btn" type="button">
          もどる
        </button>
        <div class="header-center-info">
          <span id="level-badge" class="level-badge">かんたん</span>
          <span id="question-progress" class="question-progress">だい 1 もん / 5 もん</span>
        </div>
        <button id="btn-sound" class="bb-ctrl-btn" type="button" aria-pressed="true">
          おと あり
        </button>
      </div>

      <!-- 穴埋め式の特大計算問題 -->
      <div class="equation-row" aria-live="polite">
        <span id="eq-part-a" class="eq-num">4</span>
        <span id="eq-op" class="eq-op">＋</span>
        <span id="eq-part-b" class="eq-blank">？</span>
        <span class="eq-op">＝</span>
        <span id="eq-part-c" class="eq-num">10</span>
      </div>

      <!-- 黒板メッセージ・ヒント欄 -->
      <div id="blackboard-message" class="blackboard-message">
        したの すうじを おして つみきを あてよう！
      </div>
    </header>

    <!-- 2段目：中央「物理ステージ（Matter.js）」エリア -->
    <main class="stage-container" id="stage-container">
      <canvas id="game-canvas"></canvas>
    </main>

    <!-- 3段目：下部「えらんでポン！数字ボタン（4択）」エリア -->
    <footer class="choices-container">
      <div class="choices-label" id="choices-label">
        どの すうじを いれる？ えらんで おしてね！
      </div>
      <div class="choices-grid" id="choices-grid" role="group" aria-label="すうじを えらぶ">
        <button class="choice-btn" type="button" data-index="0">4</button>
        <button class="choice-btn" type="button" data-index="1">5</button>
        <button class="choice-btn" type="button" data-index="2">6</button>
        <button class="choice-btn" type="button" data-index="3">7</button>
      </div>
    </footer>

    <!-- タイトル・コース＆難易度＆問題数選択オーバーレイ画面 -->
    <section id="title-overlay" class="overlay-screen">
      <div class="overlay-card">
        <div class="title-blackboard">
          <p class="title-sub">たのしい さんすう つみき</p>
          <h1 class="title-main">すうじ つみき</h1>
          <p class="title-desc">すうじを おして つみきを へんしん させよう！</p>
        </div>

        <!-- 難易度セレクター -->
        <div class="setting-section">
          <p class="section-heading">むずかしさを えらんでね</p>
          <div class="setting-tabs" role="radiogroup" aria-label="むずかしさ">
            <button class="diff-tab is-selected" type="button" data-level="easy">
              かんたん
            </button>
            <button class="diff-tab" type="button" data-level="normal">
              ふつう
            </button>
            <button class="diff-tab" type="button" data-level="hard">
              むずかしい
            </button>
          </div>
        </div>

        <!-- もんだい数セレクター（3問・5問・10問） -->
        <div class="setting-section">
          <p class="section-heading">もんだいの かずを えらんでね</p>
          <div class="setting-tabs" role="radiogroup" aria-label="もんだいのかず">
            <button class="count-tab" type="button" data-count="3">
              3もん
            </button>
            <button class="count-tab is-selected" type="button" data-count="5">
              5もん
            </button>
            <button class="count-tab" type="button" data-count="10">
              10もん
            </button>
          </div>
        </div>

        <!-- 4大コース選択グリッド -->
        <div class="courses-section">
          <p class="section-heading">あそぶ もんだいを えらんでね</p>
          <div class="course-grid">
            <button class="course-btn course-btn-add" type="button" data-course="add">
              <span class="course-name">たしざん</span>
              <span id="preview-add" class="course-example">4 ＋ [ ？ ] ＝ 10</span>
            </button>

            <button class="course-btn course-btn-sub" type="button" data-course="sub">
              <span class="course-name">ひきざん</span>
              <span id="preview-sub" class="course-example">8 － [ ？ ] ＝ 5</span>
            </button>

            <button class="course-btn course-btn-mul" type="button" data-course="mul">
              <span class="course-name">かけざん</span>
              <span id="preview-mul" class="course-example">2 × [ ？ ] ＝ 8</span>
            </button>

            <button class="course-btn course-btn-div" type="button" data-course="div">
              <span class="course-name">わりざん</span>
              <span id="preview-div" class="course-example">6 ÷ [ ？ ] ＝ 3</span>
            </button>
          </div>
        </div>
      </div>
    </section>

    <!-- 結果発表オーバーレイ画面 -->
    <section id="result-overlay" class="overlay-screen is-hidden" aria-hidden="true">
      <div class="overlay-card result-card">
        <div class="result-header">
          <div id="result-stamp-wrap" class="result-stamp-wrap" aria-hidden="true"></div>

          <div class="result-title-box">
            <h2 id="result-title" class="result-title">100てん まんてん！</h2>
            <p id="result-subtitle" class="result-subtitle">ぜんぶ せいかい できたね！</p>
          </div>
        </div>

        <div class="review-box">
          <div id="review-heading" class="review-heading">といた もんだいの ふりかえり</div>
          <ul id="review-list" class="review-list"></ul>
        </div>

        <div class="result-actions">
          <button id="btn-replay-same" class="action-btn action-btn-primary" type="button">
            もういちど あそぶ
          </button>
          <button id="btn-replay-select" class="action-btn action-btn-secondary" type="button">
            ほかに ちょうせん する
          </button>
        </div>
      </div>
    </section>
  </div>

  <!-- 2D物理エンジン Matter.js (CDN) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/matter-js/0.19.0/matter.min.js"></script>
  <script src="se.js"></script>
  <script src="main.js"></script>
</body>
</html>
